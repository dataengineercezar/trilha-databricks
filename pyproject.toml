[project]
name = "trilha-databricks"
version = "0.1.0"
description = "Repositório de estudos — Trilha Databricks → Certificação Data Engineer Associate"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "databricks-connect>=15.0",
    "databricks-sdk>=0.20",
    "databricks-cli>=0.18",
    "delta-spark>=3.0",
    "pyspark>=3.5",
    "mlflow>=2.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "ipykernel>=6.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["exercicios", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
